
name: Build Capri Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project archive
        run: |
          set -euo pipefail
          mkdir -p project
          cat Capri-Android-Project-v0.3.6-all-assets.zip.part* > project.zip
          unzip -tq project.zip
          unzip -q project.zip -d project

      - name: Locate project directory
        id: paths
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find project -type f -name settings.gradle.kts -print -quit | xargs dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Could not find Android project or app/build.gradle.kts"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Patch missing Android import
        env:
          PROJECT_DIR: ${{ steps.paths.outputs.project_dir }}
        run: |
          set -euo pipefail
          SERVICE_FILE="$PROJECT_DIR/app/src/main/java/com/capri/mobile/CompanionService.kt"
          if ! grep -q '^import android.view.ViewTreeObserver$' "$SERVICE_FILE"; then
            sed -i '/^package /a import android.view.ViewTreeObserver' "$SERVICE_FILE"
          fi

      - name: Verify original assets
        working-directory: ${{ steps.paths.outputs.project_dir }}
        run: |
          if [ -f tools/verify_assets.py ]; then
            python3 tools/verify_assets.py
          else
            echo "Asset verification script not found; continuing."
          fi

      - name: Build debug APK
        working-directory: ${{ steps.paths.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK exists
        env:
          PROJECT_DIR: ${{ steps.paths.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p output
          cp "$APK" output/Capri-Android-v0.3.6-debug.apk
          sha256sum output/Capri-Android-v0.3.6-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: capri-android-v0.3.6-debug
          path: output/Capri-Android-v0.3.6-debug.apk
          if-no-files-found: error
          retention-days: 14
