name:name: Build Capri Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "Capri-Android-Access-and-Agent-0.6.0.zip"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capri-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Capri APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Capri-Android-Access-and-Agent-0.6.0.zip"
          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "::error::Missing $ZIP_FILE in the repository root."
            exit 1
          fi
          ls -lh "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-project
          unzip -oq "Capri-Android-Access-and-Agent-0.6.0.zip" -d android-project
          SETTINGS_FILE="$(find android-project -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::settings.gradle.kts not found in the source archive."
            unzip -Z1 "Capri-Android-Access-and-Agent-0.6.0.zip" | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::app/build.gradle.kts not found beside settings.gradle.kts."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Located project at $PROJECT_DIR"

      - name: Upload Android project source
        uses: actions/upload-artifact@v4
        with:
          name: capri-android-source-0.6.0
          path: android-project/
          if-no-files-found: error
          retention-days: 14

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not produced."
            find "$PROJECT_DIR/app/build/outputs" -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capri-android-debug-apk-0.6.0
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Capri-Android-Access-and-Agent-0.6.0.zip"
          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "::error::Missing $ZIP_FILE in the repository root. Upload the 0.6.0 source ZIP, not the larger build kit."
            exit 1
          fi
          ls -lh "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-project
          unzip -oq "Capri-Android-Access-and-Agent-0.6.0.zip" -d android-project
          SETTINGS_FILE="$(find android-project -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::settings.gradle.kts not found in the source archive."
            unzip -Z1 "Capri-Android-Access-and-Agent-0.6.0.zip" | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::app/build.gradle.kts not found beside settings.gradle.kts."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Located project at $PROJECT_DIR"

      - name: Verify mirrored assets when verifier is present
        shell: bash
        run: |
          set -euo pipefail
          VERIFIER="$(find "$PROJECT_DIR" -type f -path '*/tools/verify_assets.py' -print -quit)"
          if [[ -n "$VERIFIER" ]]; then
            python3 "$VERIFIER"
          else
            echo "No optional asset verifier found; continuing to Android build."
          fi

      - name: Upload Android project source
        uses: actions/upload-artifact@v4
        with:
          name: capri-android-source-0.6.0
          path: android-project/
          if-no-files-found: error
          retention-days: 14

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not produced."
            find "$PROJECT_DIR/app/build/outputs" -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capri-android-debug-apk-0.6.0
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
