name: Build Capri Android APK

on:
  push:
    branches:
      - main
    paths:
      - "Capri-Android-Prototype-v0.2.1.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Capri for Android
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            platform-tools

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Capri Android project
        run: |
          test -f "Capri-Android-Prototype-v0.2.1.zip"
          mkdir -p android-project
          unzip -q "Capri-Android-Prototype-v0.2.1.zip" -d android-project
          test -f "android-project/settings.gradle.kts"
          test -f "android-project/app/build.gradle.kts"

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "Build finished, but the APK was not found."
            find android-project -type f -name "*.apk"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: capri-mobile-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
