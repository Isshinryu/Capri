
name: Build Capri Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$RUNNER_TEMP"

          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -o android-commandline-tools.zip

          mkdir -p android-tools
          unzip -q android-commandline-tools.zip -d android-tools

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -a android-tools/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reassemble Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f Capri-Android-Project-v0.3.6-all-assets.zip.part00
          test -f Capri-Android-Project-v0.3.6-all-assets.zip.part01

          cat Capri-Android-Project-v0.3.6-all-assets.zip.part* > project.zip
          unzip -tq project.zip
          mkdir extracted
          unzip -q project.zip -d extracted

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find extracted -type f \
            -name settings.gradle.kts -print -quit)"

          test -n "$SETTINGS_FILE" || {
            echo "::error::settings.gradle.kts not found in the archive"
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          test -f "$PROJECT_DIR/app/build.gradle.kts" || {
            echo "::error::app/build.gradle.kts not found"
            exit 1
          }

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Patch missing ViewTreeObserver import
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/app/src/main/java/com/capri/mobile/CompanionService.kt"
          test -f "$FILE"

          if ! grep -q '^import android.view.ViewTreeObserver$' "$FILE"; then
            sed -i '/^package /a\
\
import android.view.ViewTreeObserver' "$FILE"
          fi

      - name: Verify original assets
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f tools/verify_assets.py ]; then
            python3 tools/verify_assets.py
          else
            echo "::warning::Asset verification script not found"
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || {
            echo "::error::Gradle did not produce app-debug.apk"
            exit 1
          }

          mkdir -p output
          cp "$APK" output/Capri-Android-v0.3.6-debug.apk
          sha256sum output/Capri-Android-v0.3.6-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capri-android-v0.3.6-debug
          path: output/Capri-Android-v0.3.6-debug.apk
          if-no-files-found: error
          retention-days: 14
