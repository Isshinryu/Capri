
name: Build Capri Android APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "Capri-Android-Project-v0.3.5-all-assets.zip.part00"
      - "Capri-Android-Project-v0.3.5-all-assets.zip.part01"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capri-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Capri APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify and reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          PART0="Capri-Android-Project-v0.3.5-all-assets.zip.part00"
          PART1="Capri-Android-Project-v0.3.5-all-assets.zip.part01"
          ZIP_FILE="Capri-Android-Project-v0.3.5-all-assets.zip"

          for part in "$PART0" "$PART1"; do
            if [[ ! -s "$part" ]]; then
              echo "::error::Missing or empty archive part: $part"
              exit 1
            fi
            ls -lh "$part"
          done

          cat "$PART0" "$PART1" > "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"
          echo "Archive integrity check passed."

      - name: Extract and validate Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-project
          unzip -oq "Capri-Android-Project-v0.3.5-all-assets.zip" -d android-project

          SETTINGS_FILE="$(find android-project -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::settings.gradle.kts not found."
            unzip -Z1 "Capri-Android-Project-v0.3.5-all-assets.zip" | head -80
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::app/build.gradle.kts not found."
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -120
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project located at: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not produced."
            find "$PROJECT_DIR/app/build/outputs" -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capri-mobile-debug-apk-v0.3.5
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
