
name: Build Capri Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Reassemble project archive
        run: |
          set -euo pipefail

          test -f Capri-Android-Project-v0.3.6-all-assets.zip.part00
          test -f Capri-Android-Project-v0.3.6-all-assets.zip.part01

          cat Capri-Android-Project-v0.3.6-all-assets.zip.part* > project.zip

          unzip -tq project.zip
          mkdir -p extracted
          unzip -q project.zip -d extracted

      - name: Find Android project
        id: project
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find extracted -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found in the archive."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Patch missing ViewTreeObserver import
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/app/src/main/java/com/capri/mobile/CompanionService.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: CompanionService.kt was not found."
            exit 1
          fi

          if ! grep -q '^import android.view.ViewTreeObserver$' "$FILE"; then
            sed -i '/^package /a\
\
import android.view.ViewTreeObserver' "$FILE"
          fi

          echo "Checked ViewTreeObserver import."

      - name: Verify original assets
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f tools/verify_assets.py ]; then
            python3 tools/verify_assets.py
          else
            echo "Asset verification script not found; skipping."
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify and identify APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Build finished without producing the expected APK."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Capri-Android-v0.3.6-debug.apk
          sha256sum output/Capri-Android-v0.3.6-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capri-android-v0.3.6-debug
          path: output/Capri-Android-v0.3.6-debug.apk
          if-no-files-found: error
          retention-days: 14
