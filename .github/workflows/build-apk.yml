
name: Build Capri Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reassemble Capri project
        shell: bash
        run: |
          cat Capri-Android-Project-v0.3.6-all-assets.zip.part00 \
              Capri-Android-Project-v0.3.6-all-assets.zip.part01 \
              > capri-project.zip

          unzip -tq capri-project.zip
          mkdir -p capri-project
          unzip -q capri-project.zip -d capri-project

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/capri-project" \
            -type f -name settings.gradle.kts \
            -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not locate settings.gradle.kts"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Verify original assets
        run: python "$PROJECT_DIR/tools/verify_assets.py"

      - name: Build debug APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capri-mobile-debug-apk-v0.3.6
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
